<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Begin Again</title>
<meta name="description" content="一只送给同事们的离职纪念网页小游戏。" />
<link rel="stylesheet" href="style.css?v=20261020d" />
</head>
<body>
  <!-- 外框外的孟菲斯几何碎屑（纯装饰，不参与交互） -->
  <div class="decor" id="decor" aria-hidden="true"></div>

  <!-- 穿越预示：短促闪白 -->
  <div class="flash" id="flash" aria-hidden="true"></div>

  <div class="frame-wrap">
    <div class="phone-frame">
      <div class="frame-notch" aria-hidden="true"></div>

      <div class="screen" id="screen">
        <div class="scroll" id="scroll">
          <!-- 各视图由 main.js 从 CONFIG 渲染 -->
          <section class="view" id="view-lock"></section>
          <section class="view bleed" id="view-opening"></section>
          <section class="view" id="view-hall"></section>
          <section class="view" id="view-level1"></section>
          <section class="view" id="view-level2"></section>
          <section class="view" id="view-level3"></section>
          <section class="view" id="view-level4"></section>
          <section class="view" id="view-password"></section>
          <section class="view" id="view-final"></section>
        </div>

        <!-- 音效开关（仅在非开场页显示，避免压住群聊右上角） -->
        <button class="sfx-toggle" id="sfx-toggle" type="button" aria-label="音效开关" aria-pressed="true">
          <svg class="ic-on" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M4 9.5v5h3.6L12 18V6L7.6 9.5H4z" fill="currentColor"/>
            <path d="M15.6 9a4.2 4.2 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M18.2 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <svg class="ic-off" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M4 9.5v5h3.6L12 18V6L7.6 9.5H4z" fill="currentColor"/>
            <path d="M16.4 9.6l5 4.8M21.4 9.6l-5 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- 全局弹窗层（浮窗 / 结果 / 确认框，不算页面跳转） -->
        <div class="overlay" id="overlay">
          <div class="modal-card" id="modal"></div>
        </div>
      </div>

      <div class="frame-homebar" aria-hidden="true"></div>
    </div>
  </div>

<script src="sfx.js?v=20261020d"></script>
<script src="main.js?v=20261020d"></script>
</body>
</html>
